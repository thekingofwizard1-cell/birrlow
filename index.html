const TS=[
["Introduction & acceptance","መግቢያና ስምምነት","These Terms apply to every auction on BirrLow, run by [Company name] (we). By paying an entry fee and placing a bid you accept these Terms and the details shown on that auction page. If the two conflict, the auction page wins for that auction only.","እነዚህ ደንቦች በBirrLow ላይ ለሚደረጉ ሁሉም ጨረታዎች ይተገበራሉ፤ የሚያስተዳድረው [የኩባንያ ስም] ነው። የመግቢያ ክፍያ ከፍለው ሲጫረቱ እነዚህን ደንቦችና በጨረታው ገጽ ላይ የተገለጹ ዝርዝሮችን ተቀብለዋል። ሁለቱ ከተጋጩ ለዚያ ጨረታ ብቻ የጨረታው ገጽ ይተገበራል።"],
["Eligibility","ተሳታፊ ለመሆን መስፈርቶች","You must be 18 or older, live in Ethiopia, have an Ethiopian mobile number and a payment method supported by our payment provider, and be able to show a government ID if you win. Staff of the company, its prize partners and payment provider, and their close family, may not take part. We may check your age, identity and residence at any time.","ዕድሜዎ 18 ወይም ከዚያ በላይ፣ በኢትዮጵያ የሚኖሩ፣ የኢትዮጵያ ሞባይል ቁጥርና በክፍያ አቅራቢያችን የሚደገፍ የመክፈያ መንገድ ያለዎት መሆን አለበት፤ ካሸነፉም የመንግሥት መታወቂያ ማሳየት መቻል አለብዎት። የኩባንያው፣ የሽልማት አጋሮቹና የክፍያ አቅራቢው ሠራተኞችና የቅርብ ቤተሰቦቻቸው መሳተፍ አይችሉም። ዕድሜዎን፣ ማንነትዎንና የመኖሪያዎን ቦታ በማንኛውም ጊዜ ልናረጋግጥ እንችላለን።"],
["How the auction works","ጨረታው እንዴት ይሠራል","Each auction offers one item, with its value, entry fee, opening and closing time shown on its page. One entry fee buys one bid. Bids start at 1 Birr unless the auction page says otherwise. A bid is unique if nobody else chose the same amount; two bids at the same amount, even from one person, count as duplicates of each other. You can see the status of your own bids, never other people's. Once paid, a bid cannot be changed or withdrawn.","እያንዳንዱ ጨረታ አንድ ዕቃ ያቀርባል፤ ዋጋው፣ የመግቢያ ክፍያው፣ የሚከፈትበትና የሚዘጋበት ጊዜ በገጹ ላይ ይታያል። አንድ የመግቢያ ክፍያ አንድ ጨረታ ያስገኛል። የጨረታው ገጽ ሌላ ካልገለጸ ጨረታ ከ1 ብር ይጀምራል። ሌላ ማንም ያልመረጠው መጠን ብቸኛ ነው፤ አንድ ሰው ተመሳሳይ መጠን ሁለት ጊዜ ቢያቀርብ እርስ በርስ እንደተደጋገሙ ይቆጠራል። የራስዎን ጨረታዎች ሁኔታ ያያሉ እንጂ የሌሎችን አያዩም። አንዴ የተከፈለበት ጨረታ መቀየር ወይም ማንሳት አይቻልም።"],
["Participation & payments","ተሳትፎና ክፍያ","Payments go through [Payment provider]. A bid counts only after the provider confirms payment. If money left your account but no bid appears, contact us and we will check our records and either confirm the bid or refund the fee. Entry fees are not refunded once a bid is confirmed, except when an auction is cancelled. We keep a timestamped record of every bid so any result can be checked.","ክፍያዎች የሚፈጸሙት በ[የክፍያ አቅራቢ] በኩል ነው። ጨረታ የሚቆጠረው አቅራቢው ክፍያውን ሲያረጋግጥ ብቻ ነው። ገንዘብ ተቆርጦ ጨረታ ካልታየ ያግኙን፤ መዝገባችንን አይተን ጨረታውን እናረጋግጣለን ወይም ክፍያውን እንመልሳለን። ጨረታ ከተረጋገጠ በኋላ የመግቢያ ክፍያ አይመለስም፤ ጨረታው ከተሰረዘ ግን ይመለሳል። ማንኛውም ውጤት እንዲረጋገጥ የእያንዳንዱን ጨረታ ሰዓት የተመዘገበ መዝገብ እንይዛለን።"],
["Choosing the winner","አሸናፊን መወሰን","The winner is the person with the lowest amount chosen by only one bidder. If the lowest amount was chosen by two or more people it is skipped, and the next lowest unique amount wins. If no amount is unique at closing, the auction is extended: bids already placed stay valid and people can bid again.","አሸናፊው ሌላ ማንም ያልመረጠውን ዝቅተኛ መጠን ያቀረበ ሰው ነው። ዝቅተኛውን መጠን ሁለትና ከዚያ በላይ ሰዎች ከመረጡት ይዘለላል፤ ቀጣዩ ዝቅተኛ ብቸኛ መጠን ያሸንፋል። ሲዘጋ ብቸኛ መጠን ከሌለ ጨረታው ይራዘማል፤ የቀረቡ ጨረታዎች ፀንተው ይቆያሉ፤ ሰዎች እንደገና መጫረት ይችላሉ።"],
["Winner notification","ለአሸናፊ ማሳወቅ","The winner is told by SMS within 12 hours of closing, on the phone number used for the winning bid. The winner has 7 days to reply, prove their identity and pay the winning amount. Otherwise the prize is lost and we may offer it to the next unique bid or run a new auction.","አሸናፊው ጨረታው ከተዘጋ በ12 ሰዓት ውስጥ ለአሸናፊው ጨረታ በተጠቀመበት ስልክ ቁጥር በኤስኤምኤስ ይነገረዋል። አሸናፊው ምላሽ ለመስጠት፣ ማንነቱን ለማረጋገጥና የአሸናፊነቱን መጠን ለመክፈል 7 ቀናት አሉት። ካልሆነ ሽልማቱን ያጣል፤ እኛም ለቀጣዩ ብቸኛ ጨረታ ልናቀርበው ወይም አዲስ ጨረታ ልናካሂድ እንችላለን።"],
["The prize","ሽልማቱ","The prize is the exact item described on the auction page. No cash alternative is offered and the prize cannot be transferred. Collection or delivery is arranged during verification. The winner pays any taxes or duties not included in the item value.","ሽልማቱ በጨረታው ገጽ ላይ የተገለጸው ዕቃ ራሱ ነው። በገንዘብ አይተካም፤ ለሌላ ሰው አይተላለፍም። የመረከቢያ ወይም የማድረሻ ዝግጅት በማረጋገጫው ጊዜ ይወሰናል። በዕቃው ዋጋ ያልተካተቱ ታክሶችንና ቀረጦችን አሸናፊው ይከፍላል።"],
["Winner payment","የአሸናፊ ክፍያ","There are two separate payments: the entry fee to place a bid, and the winning amount, paid only by the winner after verification. The item is released once the winning amount is confirmed.","ሁለት የተለያዩ ክፍያዎች አሉ፦ ለመጫረት የሚከፈለው የመግቢያ ክፍያ፣ እና ከማረጋገጫ በኋላ አሸናፊው ብቻ የሚከፍለው የአሸናፊነት መጠን። ዕቃው የሚሰጠው የአሸናፊነት መጠን ከተረጋገጠ በኋላ ነው።"],
["Maximum participation","ከፍተኛ የተሳትፎ ብዛት","You may place as many paid bids in one auction as you like, unless the auction page sets a limit. A limit counts paid bids, not attempts.","የጨረታው ገጽ ገደብ ካላስቀመጠ በስተቀር በአንድ ጨረታ የፈለጉትን ያህል የተከፈለባቸው ጨረታዎች ማቅረብ ይችላሉ። ገደቡ የሚቆጠረው የተከፈለባቸውን ጨረታዎች እንጂ ሙከራዎችን አይደለም።"],
["Fraud, abuse & manipulation","ማጭበርበርና ማዛባት","Bots, scripts, several accounts, collusion, exploiting the platform and payment fraud are forbidden. We may disqualify entries, withhold or take back prizes, and report fraud to the authorities.","አውቶማቲክ መጫረቻ (ቦት)፣ ስክሪፕት፣ ብዙ አካውንት፣ ከሌሎች ጋር መመሳጠር፣ የመድረኩን ክፍተት መጠቀምና የክፍያ ማጭበርበር ክልክል ነው። ጨረታዎችን ልናሰርዝ፣ ሰውን ልናስወጣ፣ ሽልማትን ልንከለክል ወይም ልንመልስ፣ ማጭበርበርንም ለሚመለከተው አካል ልናሳውቅ እንችላለን።"],
["Technical issues","ቴክኒካዊ ችግሮች","We take reasonable care to keep the platform running but are not responsible for failures of networks, payment providers or servers outside our control. If a failure affects the fairness of a result, we will fix it fairly, using our records or by extending the auction.","መድረኩ እንዲሠራ ምክንያታዊ ጥንቃቄ እናደርጋለን፤ ነገር ግን ከቁጥጥራችን ውጭ በሆኑ የኔትወርክ፣ የክፍያ አቅራቢና የሰርቨር ችግሮች ኃላፊነት አንወስድም። ችግር የውጤቱን ፍትሐዊነት ከነካ በመዝገባችን ወይም ጨረታውን በማራዘም በፍትሐዊ መንገድ እናስተካክላለን።"],
["Extension, early closure & cancellation","ማራዘም፣ ቀድሞ መዝጋትና መሰረዝ","An auction may be extended when no bid is unique, when a technical failure blocked bidding, when the minimum number of bids is not reached, or when the law requires it. Bids carry over, and the fee, prize and rules stay the same. It can close early only when its bid limit is reached (treated as a normal close), when the prize is unavailable, when fraud affects the whole auction, when the law requires it, or when a major event makes fair running impossible. We never close early to favour anyone. A cancelled auction is refunded in full to the original payment method within 14 business days. All changes are announced on the auction page.","ብቸኛ ጨረታ ሲጠፋ፣ ቴክኒካዊ ችግር ጨረታን ሲያግድ፣ ዝቅተኛው የጨረታ ብዛት ሳይደረስ ሲቀር ወይም ሕግ ሲያስገድድ ጨረታው ሊራዘም ይችላል። የቀረቡ ጨረታዎች ይቆያሉ፤ ክፍያው፣ ሽልማቱና ደንቦቹ አይቀየሩም። ቀድሞ ሊዘጋ የሚችለው የጨረታ ገደቡ ሲደርስ (እንደ መደበኛ መዝጋት ይቆጠራል)፣ ሽልማቱ ሲጠፋ፣ ማጭበርበር ጨረታውን በሙሉ ሲነካ፣ ሕግ ሲያስገድድ ወይም ታላቅ ክስተት በፍትሐዊነት መቀጠልን ሲያስቸግር ብቻ ነው። ማንንም ለመጥቀም ቀድመን አንዘጋም። የተሰረዘ ጨረታ ክፍያ በ14 የሥራ ቀናት ውስጥ በመጀመሪያው የመክፈያ መንገድ ሙሉ በሙሉ ይመለሳል። ሁሉም ለውጦች በጨረታው ገጽ ላይ ይገለጻሉ።"],
["Privacy & personal data","ግላዊነትና የግል መረጃ","We collect your name, phone number and payment confirmation, and ID documents if you win. We use them only to run auctions, take payments, contact you, follow the law and stop fraud. We do not sell your data.","ስምዎን፣ ስልክ ቁጥርዎን፣ የክፍያ ማረጋገጫዎን፣ ካሸነፉም የመታወቂያ ሰነዶችን እንሰበስባለን። የምንጠቀምባቸው ጨረታዎችን ለማካሄድ፣ ክፍያ ለመቀበል፣ እርስዎን ለማግኘት፣ ሕግን ለማክበርና ማጭበርበርን ለመከላከል ብቻ ነው። መረጃዎን አንሸጥም።"],
["Intellectual property","የአእምሮ ንብረት","The BirrLow name, logo, software and method belong to [Company name]. Product names and brands belong to their owners.","የBirrLow ስም፣ አርማ፣ ሶፍትዌርና አሠራር የ[የኩባንያ ስም] ንብረት ናቸው። የዕቃዎች ስሞችና ብራንዶች የባለቤቶቻቸው ናቸው።"],
["Limitation of liability","የኃላፊነት ገደብ","As far as the law allows, we are not liable for indirect losses, and our liability for any one auction is limited to the entry fees you paid in it, except for fraud or anything the law does not let us limit.","ሕጉ በሚፈቅደው መጠን በተዘዋዋሪ ለሚደርስ ጉዳት ተጠያቂ አይደለንም፤ ለአንድ ጨረታ ኃላፊነታችን በዚያ ጨረታ ከከፈሉት የመግቢያ ክፍያ አይበልጥም፤ ማጭበርበርንና ሕጉ እንድንገድበው የማይፈቅደውን ጉዳይ ሳይጨምር።"],
["Complaints & disputes","ቅሬታና አለመግባባት","Send complaints within 48 hours of the event. We reply within 3 business days. If it is not resolved, both sides try to settle amicably for 30 days before going to court.","ቅሬታዎን ከተከሰተው ነገር በ48 ሰዓት ውስጥ ያቅርቡ። በ3 የሥራ ቀናት ውስጥ እንመልሳለን። ካልተፈታ ወደ ፍርድ ቤት ከመሄድ በፊት ሁለቱም ወገኖች ለ30 ቀናት በሰላም ለመፍታት ይሞክራሉ።"],

setTimeout(()=>{W('bl_bids'+p.id,bidsOf(p.id).concat(p.nums));W('bl_extra'+p.id,S('bl_extra'+p.id,0)+p.nums.length);document.getElementById('app').innerHTML=band(t('ok'),'')+wrap(`<div class="bg-white border rounded-3xl p-6 max-w-md mx-auto text-center"><div class="text-6xl">✅</div><p class="font-h font-bold text-xl mt-3">${t('in')}</p><p class="text-gray-600 mt-2">${t('back2')}</p><a href="#/a/${p.id}" class="${btn} mt-5">${t('yours')}</a></div>`)},1200)}
Object.assign(T.en,{tgb:"Open in Telegram",tgonly:"Bids are placed from Telegram. Open @BirrLowBot to bid.",e_auth:"Please open BirrLow from the Telegram bot.",e_closed:"This auction or order is not open.",e_min:"Minimum bid is 1 Birr.",e_dec:"Use at most 2 decimal places, like 1.25.",e_dup:"You already bid one of these amounts.",e_cap:"You reached the maximum number of bids for this auction.",e_bad:"Please check your amounts.",e_server:"Something went wrong. Please try again."});
Object.assign(T.am,{tgb:"በቴሌግራም ይክፈቱ",tgonly:"ጨረታ የሚቀርበው ከቴሌግራም ነው። ለመጫረት @BirrLowBot ይክፈቱ።",e_auth:"እባክዎ BirrLowን ከቴሌግራም ቦት ይክፈቱ።",e_closed:"ይህ ጨረታ ወይም ትዕዛዝ ክፍት አይደለም።",e_min:"ዝቅተኛው ጨረታ 1 ብር ነው።",e_dec:"ቢበዛ 2 አሃዝ ከነጥብ በኋላ ይጠቀሙ፣ ለምሳሌ 1.25።",e_dup:"ከእነዚህ መጠኖች አንዱን አስቀድመው አቅርበዋል።",e_cap:"በዚህ ጨረታ ማቅረብ የሚችሉትን ከፍተኛ ብዛት ደርሰዋል።",e_bad:"እባክዎ መጠኖችዎን ያረጋግጡ።",e_server:"የሆነ ችግር ተፈጥሯል። እባክዎ እንደገና ይሞክሩ።"});
// ---- Server connection (same Vercel address, /api) ----
async function api(r,body){const o=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,initData:TG?TG.initData:''})}:{};const res=await fetch('/api?r='+r,o);return res.json()}
const GRAD=["from-indigo-700 to-purple-500","from-slate-700 to-slate-400","from-zinc-600 to-zinc-300","from-emerald-800 to-teal-400"];
async function loadA(first){try{const d=await api('auctions');if(!d.ok||!d.auctions.length)return;
A.length=0;d.auctions.forEach((x,i)=>A.push({id:x.id,n:{en:x.name,am:x.name_am||x.name},e:x.emoji||'🎁',c:GRAD[i%4],cat:'Auction',fee:+x.fee,bids:x.bids,views:0,retail:+x.retail||0,people:x.people,end:new Date(x.end_at).getTime(),cents:true,d:{en:x.description||'',am:x.description||''}}));
LIVE=true;if(first){route();return}
const h=location.hash;if(h==''||h=='#/')route();else{const m=h.match(/^#\/a\/(\d+)/);if(m){const a=A.find(x=>x.id==+m[1]),c=document.getElementById('bc');if(a&&c)c.textContent=mon(a.bids);const pc=document.getElementById('pc');if(a&&pc&&a.people!=null)pc.textContent=mon(a.people)}}}catch(e){}}
async function serverPay(id,nums){const e=document.getElementById('err');const fail=k=>{e.textContent=t('e_'+k);e.classList.remove('hidden')};
if(!TG)return fail('auth');e.classList.add('hidden');
try{const d=await api('order',{auction_id:id,amounts:nums});if(!d.ok)return fail(d.error);TG.openLink(location.origin+location.pathname+'#/pay?o='+d.token)}catch(x){fail('server')}}
async function loadOrder(tok){const box=()=>document.getElementById('ord');let d;try{d=await api('order&o='+tok)}catch(e){d={ok:false,error:'server'}}
if(!box())return;if(!d.ok){box().textContent=t('e_'+d.error);return}const o=d.order;window._ord=tok;
if(o.status=='paid'){box().innerHTML=okCard();return}
box().innerHTML=`<div class="bg-white border rounded-3xl p-6 max-w-md mx-auto text-left"><div class="text-5xl text-center">${o.emoji||'🎁'}</div><h3 class="font-h font-bold text-xl text-center mt-2">${o.name} #${o.auction_id}</h3><div class="mt-4 divide-y text-ink">${o.amounts.map(n=>`<div class="flex justify-between py-2"><span>${t('yb')}</span><b>${n} ETB</b></div>`).join('')}<div class="flex justify-between py-2"><span>${t('fee')} × ${o.amounts.length}</span><b>${o.total} ETB</b></div></div><button id="cp" onclick="payOrder()" class="${btn} w-full mt-5 text-center">${t('chapa').replace('{n}',o.total)}</button><p class="text-xs text-gray-500 text-center mt-2">${t('tmode')}</p></div>`}
const okCard=()=>`<div class="bg-white border rounded-3xl p-6 max-w-md mx-auto text-center text-ink"><div class="text-6xl">✅</div><p class="font-h font-bold text-xl mt-3">${t('in')}</p><p class="text-gray-600 mt-2">${t('back2')}</p><a href="#/my" class="${btn} mt-5">${t('my')}</a></div>`;
async function payOrder(){const b=document.getElementById('cp');b.disabled=true;b.textContent=t('pp');let d;try{d=await api('pay',{o:window._ord})}catch(e){d={ok:false,error:'server'}}
document.getElementById('ord').innerHTML=d.ok?okCard():`<p class="text-red-600">${t('e_'+d.error)}</p>`}
async function loadMy(){let d;try{d=await api('mybids',{})}catch(e){d={ok:false,error:'server'}}const b=document.getElementById('mybox');if(!b)return;
if(!d.ok){b.innerHTML=`<p>${t('e_'+d.error)}</p>`;return}
b.innerHTML=d.bids.length?bidGroup(t('cur'),d.bids.filter(x=>x.astatus!='completed'))+bidGroup(t('past'),d.bids.filter(x=>x.astatus=='completed')):`<p>${t('nob')}</p>`}
Object.assign(T.en,{pp2:"Participants",ret:"Retail price",bidid:"Bid ID",chosen:"Chosen",just1:"Only you chose this number",won2:"Won",lost2:"Lost",cur:"Active auctions",past:"Past auctions"});
Object.assign(T.am,{pp2:"ተሳታፊዎች",ret:"የገበያ ዋጋ",bidid:"የጨረታ መለያ",chosen:"ተመርጧል",just1:"ይህን ቁጥር እርስዎ ብቻ መርጠዋል",won2:"አሸንፈዋል",lost2:"አላሸነፉም",cur:"ክፍት ጨረታዎች",past:"ያለፉ ጨረታዎች"});
const bidRow=x=>{const done=x.astatus=='completed',good=done?x.won:x.status=='unique',lab=done?t(x.won?'won2':'lost2'):t(x.status=='unique'?'u':'d');
return `<div class="p-4 border-b last:border-0"><div class="flex justify-between items-center"><div class="font-bold">${x.name} #${x.auction_id}</div><span class="text-xs font-bold px-3 py-1 rounded-full ${good?'bg-g-l text-g':'bg-red-100 text-red-700'}">${lab}</span></div><div class="font-h text-xl mt-1">${x.amount} ETB</div><div class="text-xs text-gray-500 mt-1">${t('bidid')}: ${x.id} · ${x.reps>1?t('chosen')+' ×'+x.reps:t('just1')}</div></div>`};
const bidGroup=(h,l)=>l.length?`<h3 class="font-h font-bold text-lg mt-6 mb-2">${h}</h3><div class="bg-white border rounded-2xl text-ink">${l.map(bidRow).join('')}</div>`:'';
loadA(true);setInterval(()=>loadA(false),8000);

chrome=function(){_chrome();if(LIVE){['nav','mnav'].forEach(i=>{const e=document.getElementById(i);e.innerHTML=e.innerHTML.replace(/<a href="#\/login"[^>]*>[^<]*<\/a>/,`<a href="#/my" class="hover:text-g">${t('my')}</a>`).replace(/<a href="#\/register"[^>]*>[^<]*<\/a>/,TG?'':`<a href="https://t.me/BirrLowBot" class="bg-g text-white rounded-lg px-4 py-2">${t('tgb')}</a>`)});return}if(!S('bl_user',null))return;['nav','mnav'].forEach(i=>{const e=document.getElementById(i);e.innerHTML=e.innerHTML.replace('href="#/login"','href="#/my"').replace('>'+t('si')+'<','>'+t('my')+'<').replace(/<a href="#\/register"[^>]*>[^<]*<\/a>/,(TG?'':`<a href="#/out" class="bg-g text-white rounded-lg px-4 py-2">${t('out')}</a>`))})};
route();
